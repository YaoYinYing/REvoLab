name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: revolab
          POSTGRES_USER: revolab
          POSTGRES_PASSWORD: revolab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revolab -d revolab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      REVOLAB_DATABASE_URL: postgresql+psycopg://revolab:revolab@localhost:5432/revolab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check backend
      - run: mypy
      - run: pytest
      - run: cd backend && alembic upgrade head && alembic check
      - name: Phase-3 PostgreSQL acceptance (credential/availability on migrated schema)
        env:
          REVOLAB_TEST_DATABASE_URL: postgresql+psycopg://revolab:revolab@localhost:5432/revolab
        run: pytest -q backend/tests/test_postgres_integration.py
      - name: Export OpenAPI snapshot and check for contract drift
        run: |
          python -m revolab.export_openapi > frontend/src/contracts/openapi.json
          git diff --exit-code -- frontend/src/contracts/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Regenerate contracts and check for drift
        run: npm run check:contracts

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: revolab
          POSTGRES_USER: revolab
          POSTGRES_PASSWORD: revolab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revolab -d revolab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      REVOLAB_DATABASE_URL: postgresql+psycopg://revolab:revolab@localhost:5432/revolab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: cd backend && alembic upgrade head
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
